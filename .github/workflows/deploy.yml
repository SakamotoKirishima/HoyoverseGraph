name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target environment"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run backend lint
        run: ruff check .

      - name: Run backend tests
        run: pytest

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ inputs.environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate deployment configuration
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "Missing environment variable BACKEND_URL."
            exit 1
          fi

          if [ -z "$FRONTEND_URL" ]; then
            echo "Missing environment variable FRONTEND_URL."
            exit 1
          fi

          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Missing environment secret RENDER_DEPLOY_HOOK."
            exit 1
          fi

      - name: Trigger backend deploy on Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK" \
            --output /dev/null

      - name: Smoke check deployed services
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          check_url() {
            local url="$1"
            local label="$2"
            local attempt=1
            local max_attempts=15
            local sleep_seconds=20

            while [ "$attempt" -le "$max_attempts" ]; do
              if curl --fail --silent --show-error --location "$url" --output /dev/null; then
                echo "$label is healthy."
                return 0
              fi

              echo "$label not ready yet (attempt $attempt/$max_attempts)."
              attempt=$((attempt + 1))
              sleep "$sleep_seconds"
            done

            echo "$label did not become healthy in time."
            return 1
          }

          check_url "$BACKEND_URL/health" "backend /health"
          check_url "$BACKEND_URL/health/db" "backend /health/db"
          check_url "$FRONTEND_URL" "frontend"
